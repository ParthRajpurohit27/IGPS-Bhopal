<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Data Portal | IGPS Bhopal</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#4F46E5', secondary: '#F59E0B' }, borderRadius: { 'none': '0px', 'sm': '4px', DEFAULT: '8px', 'md': '12px', 'lg': '16px', 'xl': '20px', '2xl': '24px', '3xl': '32px', 'full': '9999px', 'button': '8px' } } } }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/zX25kF5R/Screenshot-42.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md">
        <div class="text-center mb-6">
            <img src="https://i.postimg.cc/fWxPrJMh/single-without-bg.png" alt="IGPS Logo" class="h-16 mx-auto mb-3">
            <h1 class="text-xl font-semibold text-gray-800">Student Data Portal</h1>
            <p class="text-sm text-gray-500">Indira Gandhi Public School, Prempura, Bhopal</p>
        </div>

        <div class="bg-white shadow-lg rounded-lg p-8">
            <form id="loginForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" required
                        class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
                        placeholder="you@example.com">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" required
                        class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
                        placeholder="••••••••">
                </div>

                <div id="errorMsg" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded px-3 py-2 mb-4"></div>

                <button type="submit" id="loginBtn"
                    class="w-full bg-primary text-white font-medium py-2.5 !rounded-button hover:bg-primary/90 transition-colors flex items-center justify-center">
                    <span id="loginBtnText">Login</span>
                    <i id="loginSpinner" class="ri-loader-4-line animate-spin ml-2 hidden"></i>
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-gray-400 mt-6">Access restricted to authorized school staff only.</p>
        <p class="text-center text-xs mt-2"><a href="../index.html" class="text-primary hover:underline">← Back to school website</a></p>
        <p class="text-center text-xs mt-4">
            <button class="pwa-install-btn hidden text-green-600 hover:text-green-700 font-medium cursor-pointer">
                <i class="ri-download-cloud-2-line mr-1"></i> Install Admin App
            </button>
        </p>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        // If already logged in, go straight to dashboard
        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.href = "dashboard.html";
        })();

        const form = document.getElementById("loginForm");
        const errorMsg = document.getElementById("errorMsg");
        const loginBtn = document.getElementById("loginBtn");
        const loginBtnText = document.getElementById("loginBtnText");
        const loginSpinner = document.getElementById("loginSpinner");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorMsg.classList.add("hidden");
            loginBtn.disabled = true;
            loginBtnText.textContent = "Logging in...";
            loginSpinner.classList.remove("hidden");

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorMsg.textContent = "Login failed: " + error.message;
                errorMsg.classList.remove("hidden");
                loginBtn.disabled = false;
                loginBtnText.textContent = "Login";
                loginSpinner.classList.add("hidden");
                return;
            }

            window.location.href = "dashboard.html";
        });

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed: ', err));
            });
        }

        // PWA Install Prompt Handler
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtns = document.querySelectorAll('.pwa-install-btn');
            installBtns.forEach(btn => {
                btn.classList.remove('hidden');
                btn.addEventListener('click', async () => {
                    btn.classList.add('hidden');
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    deferredPrompt = null;
                });
            });
        });
    </script>
</body>

</html>
