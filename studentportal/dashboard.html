<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Portal | IGPS Bhopal</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#4F46E5', secondary: '#F59E0B' }, borderRadius: { 'none': '0px', 'sm': '4px', DEFAULT: '8px', 'md': '12px', 'lg': '16px', 'xl': '20px', '2xl': '24px', '3xl': '32px', 'full': '9999px', 'button': '8px' } } } }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .class-pill.active { background-color: #4F46E5; color: white; border-color: #4F46E5; }
        .tab-btn.active { background-color: #4F46E5; color: white; }
        .status-pill.active { background-color: #4F46E5; color: white; border-color: #4F46E5; }
    </style>
</head>

<body class="bg-gray-50 min-h-screen pb-10">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="container mx-auto px-3 sm:px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2 sm:gap-3">
                <img src="https://i.postimg.cc/fWxPrJMh/single-without-bg.png" alt="IGPS Logo" class="h-9 sm:h-10">
                <div>
                    <h1 class="text-sm sm:text-base font-semibold text-gray-800 leading-tight">Student Data Portal</h1>
                    <p class="text-[10px] sm:text-xs text-gray-400 leading-tight">IGPS Bhopal</p>
                </div>
            </div>
            <div class="flex items-center gap-2 sm:gap-3">
                <span id="userEmail" class="text-xs text-gray-500 hidden sm:inline"></span>
                <button id="logoutBtn" class="text-xs sm:text-sm text-red-600 border border-red-200 hover:bg-red-50 px-2.5 sm:px-3 py-1.5 !rounded-button">
                    <i class="ri-logout-box-line"></i><span class="hidden sm:inline ml-1">Logout</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-3 sm:px-4 py-4 sm:py-6">

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 sm:gap-4 mb-4 sm:mb-6">
            <div class="bg-white rounded-lg shadow-sm p-3 sm:p-4">
                <p class="text-[11px] sm:text-xs text-gray-400">Total Students</p>
                <p id="statTotal" class="text-xl sm:text-2xl font-semibold text-gray-800">–</p>
            </div>
            <div class="bg-white rounded-lg shadow-sm p-3 sm:p-4">
                <p class="text-[11px] sm:text-xs text-gray-400">Aadhar Pending</p>
                <p id="statAadharPending" class="text-xl sm:text-2xl font-semibold text-amber-600">–</p>
            </div>
            <div class="bg-white rounded-lg shadow-sm p-3 sm:p-4">
                <p class="text-[11px] sm:text-xs text-gray-400">APAAR Pending</p>
                <p id="statApaarPending" class="text-xl sm:text-2xl font-semibold text-amber-600">–</p>
            </div>
            <div class="bg-white rounded-lg shadow-sm p-3 sm:p-4">
                <p class="text-[11px] sm:text-xs text-gray-400">Showing</p>
                <p id="statShowing" class="text-xl sm:text-2xl font-semibold text-gray-800">–</p>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
            <button data-tab="all" class="tab-btn active whitespace-nowrap text-sm px-4 py-2 rounded-full border border-gray-200 font-medium">
                <i class="ri-team-line mr-1"></i>All Students
            </button>
            <button data-tab="aadhar" class="tab-btn whitespace-nowrap text-sm px-4 py-2 rounded-full border border-gray-200 font-medium">
                <i class="ri-shield-check-line mr-1"></i>Aadhar Status
            </button>
            <button data-tab="apaar" class="tab-btn whitespace-nowrap text-sm px-4 py-2 rounded-full border border-gray-200 font-medium">
                <i class="ri-award-line mr-1"></i>APAAR Status
            </button>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-lg shadow-sm p-3 sm:p-4 mb-4 sm:mb-6">
            <div class="flex flex-wrap items-center gap-2 mb-3" id="classFilters">
                <button data-class="all" class="class-pill active text-xs sm:text-sm px-3 sm:px-4 py-1.5 rounded-full border border-gray-200">All Classes</button>
            </div>

            <!-- status quick filter, only shown on aadhar/apaar tabs -->
            <div id="statusFilters" class="hidden flex flex-wrap items-center gap-2 mb-3">
                <button data-status="all" class="status-pill active text-xs sm:text-sm px-3 py-1.5 rounded-full border border-gray-200">All</button>
                <button data-status="verified" class="status-pill text-xs sm:text-sm px-3 py-1.5 rounded-full border border-gray-200">✓ Verified</button>
                <button data-status="pending" class="status-pill text-xs sm:text-sm px-3 py-1.5 rounded-full border border-gray-200">✗ Pending</button>
            </div>

            <div class="flex flex-col sm:flex-row gap-2 sm:gap-3 mb-3">
                <div class="relative flex-1">
                    <i class="ri-search-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input id="searchInput" type="text" placeholder="Search name, roll no, father's name, Aadhar no..."
                        class="w-full border border-gray-300 rounded pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <select id="sectionFilter" class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                    <option value="all">All Sections</option>
                </select>
            </div>

            <!-- Download current filtered view -->
            <div class="flex flex-wrap gap-2 pt-2 border-t border-gray-100">
                <span class="text-xs text-gray-400 self-center mr-1">Download this list:</span>
                <button id="downloadPdfBtn" class="text-xs sm:text-sm bg-primary text-white px-3 py-1.5 !rounded-button hover:bg-primary/90">
                    <i class="ri-file-pdf-2-line mr-1"></i>As PDF
                </button>
                <button id="downloadImgBtn" class="text-xs sm:text-sm bg-secondary text-white px-3 py-1.5 !rounded-button hover:bg-secondary/90">
                    <i class="ri-image-2-line mr-1"></i>As Image
                </button>
            </div>
        </div>

        <!-- Loading / Error / Empty -->
        <div id="loadingState" class="text-center py-16 text-gray-400">
            <i class="ri-loader-4-line animate-spin text-3xl"></i>
            <p class="mt-2 text-sm">Loading student data...</p>
        </div>
        <div id="errorState" class="hidden text-center py-16 text-red-500 text-sm"></div>
        <div id="emptyState" class="hidden text-center py-16 text-gray-400 text-sm">No students found for this filter.</div>

        <!-- Card grid (mobile-friendly, works on all screen sizes) -->
        <div id="cardGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>

        <!-- Pagination -->
        <div id="paginationBar" class="hidden flex items-center justify-between mt-5 text-sm">
            <button id="prevPageBtn" class="px-3 py-1.5 border border-gray-200 rounded !rounded-button text-gray-600 disabled:opacity-40">
                <i class="ri-arrow-left-s-line"></i> Prev
            </button>
            <span id="pageIndicator" class="text-gray-500 text-xs sm:text-sm"></span>
            <button id="nextPageBtn" class="px-3 py-1.5 border border-gray-200 rounded !rounded-button text-gray-600 disabled:opacity-40">
                Next <i class="ri-arrow-right-s-line"></i>
            </button>
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="detailModal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center px-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg max-h-[85vh] overflow-y-auto">
            <div class="flex items-center justify-between px-5 py-4 border-b sticky top-0 bg-white">
                <h3 class="font-semibold text-gray-800">Student Details</h3>
                <button id="closeModal" class="text-gray-400 hover:text-gray-700"><i class="ri-close-line text-xl"></i></button>
            </div>
            <div id="modalBody" class="p-5 space-y-3 text-sm"></div>
        </div>
    </div>

    <!-- Hidden container used only when generating a PDF/Image report (not shown on screen) -->
    <div id="reportRoot" style="position:fixed; left:-9999px; top:0; width:800px; background:#fff;"></div>

    <script src="supabase-config.js"></script>
    <script>
        let ALL_STUDENTS = [];
        let currentClass = "all";
        let currentSection = "all";
        let currentTab = "all";        // all | aadhar | apaar
        let currentStatus = "all";     // all | verified | pending
        let currentPage = 1;
        const PAGE_SIZE = 24;

        const cardGrid = document.getElementById("cardGrid");
        const loadingState = document.getElementById("loadingState");
        const errorState = document.getElementById("errorState");
        const emptyState = document.getElementById("emptyState");
        const paginationBar = document.getElementById("paginationBar");

        // ---- Auth guard ----
        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "index.html"; return; }
            document.getElementById("userEmail").textContent = session.user.email;
            loadStudents();
        })();
        supabaseClient.auth.onAuthStateChange((event) => {
            if (event === "SIGNED_OUT") window.location.href = "index.html";
        });
        document.getElementById("logoutBtn").addEventListener("click", async () => {
            await supabaseClient.auth.signOut();
            window.location.href = "index.html";
        });

        // ---- Tabs ----
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                currentTab = btn.dataset.tab;
                currentStatus = "all";
                currentPage = 1;
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                document.getElementById("statusFilters").classList.toggle("hidden", currentTab === "all");
                document.querySelectorAll(".status-pill").forEach(b => b.classList.remove("active"));
                document.querySelector('.status-pill[data-status="all"]').classList.add("active");
                render();
            });
        });
        document.getElementById("statusFilters").addEventListener("click", (e) => {
            const btn = e.target.closest("button[data-status]");
            if (!btn) return;
            currentStatus = btn.dataset.status;
            currentPage = 1;
            document.querySelectorAll(".status-pill").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            render();
        });

        // ---- Class filter pills (1 to 8) ----
        const classFiltersEl = document.getElementById("classFilters");
        for (let c = 1; c <= 8; c++) {
            const btn = document.createElement("button");
            btn.dataset.class = String(c);
            btn.className = "class-pill text-xs sm:text-sm px-3 sm:px-4 py-1.5 rounded-full border border-gray-200";
            btn.textContent = "Class " + c;
            classFiltersEl.appendChild(btn);
        }
        classFiltersEl.addEventListener("click", (e) => {
            const btn = e.target.closest("button[data-class]");
            if (!btn) return;
            currentClass = btn.dataset.class;
            currentPage = 1;
            [...classFiltersEl.querySelectorAll("button")].forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            render();
        });

        document.getElementById("searchInput").addEventListener("input", () => { currentPage = 1; render(); });
        document.getElementById("sectionFilter").addEventListener("change", (e) => {
            currentSection = e.target.value; currentPage = 1; render();
        });

        // ---- Load data from Supabase ----
        async function loadStudents() {
            loadingState.classList.remove("hidden");
            errorState.classList.add("hidden");
            cardGrid.classList.add("hidden");
            emptyState.classList.add("hidden");
            paginationBar.classList.add("hidden");

            const { data, error } = await supabaseClient
                .from("students")
                .select("*")
                .order("class", { ascending: true })
                .order("roll_number", { ascending: true });

            loadingState.classList.add("hidden");

            if (error) {
                errorState.textContent = "Could not load data: " + error.message;
                errorState.classList.remove("hidden");
                return;
            }

            ALL_STUDENTS = data || [];

            const sections = [...new Set(ALL_STUDENTS.map(s => s.section).filter(Boolean))].sort();
            const sectionFilter = document.getElementById("sectionFilter");
            sections.forEach(sec => {
                const opt = document.createElement("option");
                opt.value = sec; opt.textContent = "Section " + sec;
                sectionFilter.appendChild(opt);
            });

            render();
        }

        // Same as getFiltered() but ignores tab/status/search — used for the top stat cards
        // so they reflect the selected Class/Section, not the status filter.
        function getClassScoped() {
            return ALL_STUDENTS.filter(s => {
                if (currentClass !== "all" && String(s.class) !== currentClass) return false;
                if (currentSection !== "all" && s.section !== currentSection) return false;
                return true;
            });
        }

        function getFiltered() {
            const query = document.getElementById("searchInput").value.trim().toLowerCase();
            return ALL_STUDENTS.filter(s => {
                if (currentClass !== "all" && String(s.class) !== currentClass) return false;
                if (currentSection !== "all" && s.section !== currentSection) return false;

                if (currentTab === "aadhar" && currentStatus !== "all") {
                    const has = !!s.aadhar_number;
                    if (currentStatus === "verified" && !has) return false;
                    if (currentStatus === "pending" && has) return false;
                }
                if (currentTab === "apaar" && currentStatus !== "all") {
                    const has = !!s.apaar_id;
                    if (currentStatus === "verified" && !has) return false;
                    if (currentStatus === "pending" && has) return false;
                }

                if (query) {
                    const haystack = [s.student_name, s.roll_number, s.father_name, s.mother_name, s.aadhar_number, s.apaar_id]
                        .filter(Boolean).join(" ").toLowerCase();
                    if (!haystack.includes(query)) return false;
                }
                return true;
            });
        }

        function statusBadge(has, label) {
            return has
                ? `<span class="inline-flex items-center gap-1 text-green-700 bg-green-50 px-2 py-0.5 rounded-full text-xs"><i class="ri-check-line"></i>${label}</span>`
                : `<span class="inline-flex items-center gap-1 text-red-600 bg-red-50 px-2 py-0.5 rounded-full text-xs"><i class="ri-close-line"></i>${label}</span>`;
        }

        function studentCardHTML(s) {
            return `
            <div class="bg-white rounded-lg shadow-sm p-4 cursor-pointer hover:shadow-md transition-shadow" data-id="${s.id}">
                <div class="flex items-start justify-between mb-2">
                    <div>
                        <p class="font-semibold text-gray-800">${s.student_name ?? "-"}</p>
                        <p class="text-xs text-gray-400">Class ${s.class ?? "-"}${s.section ? " • Sec " + s.section : ""} • Roll ${s.roll_number ?? "-"}</p>
                    </div>
                </div>
                <p class="text-xs text-gray-500 mb-2"><i class="ri-user-line mr-1"></i>${s.father_name ?? "Father's name N/A"}</p>
                <div class="flex flex-wrap gap-2">
                    ${statusBadge(!!s.aadhar_number, "Aadhar")}
                    ${statusBadge(!!s.apaar_id, "APAAR")}
                </div>
            </div>`;
        }

        function render() {
            const scoped = getClassScoped();
            document.getElementById("statTotal").textContent = scoped.length;
            document.getElementById("statAadharPending").textContent = scoped.filter(s => !s.aadhar_number).length;
            document.getElementById("statApaarPending").textContent = scoped.filter(s => !s.apaar_id).length;

            const filtered = getFiltered();
            document.getElementById("statShowing").textContent = filtered.length;

            if (filtered.length === 0) {
                cardGrid.classList.add("hidden");
                paginationBar.classList.add("hidden");
                emptyState.classList.remove("hidden");
                return;
            }
            emptyState.classList.add("hidden");
            cardGrid.classList.remove("hidden");

            const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
            if (currentPage > totalPages) currentPage = totalPages;
            const pageItems = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

            cardGrid.innerHTML = pageItems.map(studentCardHTML).join("");
            [...cardGrid.querySelectorAll("[data-id]")].forEach(el => {
                el.addEventListener("click", () => openDetail(el.dataset.id));
            });

            paginationBar.classList.toggle("hidden", filtered.length <= PAGE_SIZE);
            document.getElementById("pageIndicator").textContent =
                `Page ${currentPage} of ${totalPages} (${filtered.length} students)`;
            document.getElementById("prevPageBtn").disabled = currentPage <= 1;
            document.getElementById("nextPageBtn").disabled = currentPage >= totalPages;
        }

        document.getElementById("prevPageBtn").addEventListener("click", () => { currentPage--; render(); });
        document.getElementById("nextPageBtn").addEventListener("click", () => { currentPage++; render(); });

        // ---- Detail modal ----
        const FIELD_LABELS = {
            student_name: "Student Name", class: "Class", section: "Section", roll_number: "Roll Number",
            date_of_birth: "Date of Birth", gender: "Gender", father_name: "Father's Name", mother_name: "Mother's Name",
            parent_contact: "Parent Contact", alternate_contact: "Alternate Contact", address: "Address",
            aadhar_number: "Aadhar Number", aadhar_name: "Name as per Aadhar", apaar_id: "APAAR ID",
            admission_date: "Admission Date", blood_group: "Blood Group", category: "Category",
        };

        function openDetail(id) {
            const s = ALL_STUDENTS.find(x => String(x.id) === String(id));
            if (!s) return;
            const modalBody = document.getElementById("modalBody");
            let rows = Object.entries(FIELD_LABELS)
                .filter(([key]) => s[key] !== undefined && s[key] !== null && s[key] !== "")
                .map(([key, label]) => `
                    <div class="flex justify-between border-b border-gray-50 pb-2 gap-4">
                        <span class="text-gray-400">${label}</span>
                        <span class="text-gray-800 font-medium text-right">${s[key]}</span>
                    </div>`).join("");
            if (s.additional_info && typeof s.additional_info === "object") {
                rows += Object.entries(s.additional_info)
                    .filter(([, v]) => v !== null && v !== "")
                    .map(([key, val]) => `
                        <div class="flex justify-between border-b border-gray-50 pb-2 gap-4">
                            <span class="text-gray-400">${key}</span>
                            <span class="text-gray-800 font-medium text-right">${val}</span>
                        </div>`).join("");
            }
            modalBody.innerHTML = rows || `<p class="text-gray-400">No details available.</p>`;
            document.getElementById("detailModal").classList.remove("hidden");
        }
        document.getElementById("closeModal").addEventListener("click", () => document.getElementById("detailModal").classList.add("hidden"));
        document.getElementById("detailModal").addEventListener("click", (e) => { if (e.target.id === "detailModal") e.target.classList.add("hidden"); });

        // ---- Download report (PDF / Image) for the CURRENT filtered view (all matching rows, not just current page) ----
        function reportTitle() {
            let parts = [];
            parts.push(currentTab === "all" ? "Student List" : currentTab === "aadhar" ? "Aadhar Status" : "APAAR Status");
            if (currentClass !== "all") parts.push("Class " + currentClass);
            if (currentSection !== "all") parts.push("Sec " + currentSection);
            if (currentTab !== "all" && currentStatus !== "all") parts.push(currentStatus === "verified" ? "Verified only" : "Pending only");
            return parts.join(" - ");
        }

        function buildReportHTML(list) {
            const title = reportTitle();
            const rows = list.map((s, i) => `
                <tr style="border-bottom:1px solid #eee;">
                    <td style="padding:6px 8px;">${i + 1}</td>
                    <td style="padding:6px 8px;">${s.student_name ?? "-"}</td>
                    <td style="padding:6px 8px;">${s.class ?? "-"}${s.section ? "-" + s.section : ""}</td>
                    <td style="padding:6px 8px;">${s.roll_number ?? "-"}</td>
                    <td style="padding:6px 8px;">${s.father_name ?? "-"}</td>
                    ${currentTab !== "apaar" ? `<td style="padding:6px 8px; text-align:center;">${s.aadhar_number ? "✓" : "✗"}</td>` : ""}
                    ${currentTab !== "aadhar" ? `<td style="padding:6px 8px; text-align:center;">${s.apaar_id ? "✓ " + s.apaar_id : "✗"}</td>` : ""}
                </tr>`).join("");

            return `
            <div style="font-family: Arial, sans-serif; padding:20px; width:800px;">
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px;">
                    <img src="https://i.postimg.cc/fWxPrJMh/single-without-bg.png" style="height:40px;">
                    <div>
                        <div style="font-weight:700; font-size:16px;">Indira Gandhi Public School - Prempura, Bhopal</div>
                        <div style="font-size:12px; color:#666;">${title}</div>
                    </div>
                </div>
                <div style="font-size:11px; color:#999; margin-bottom:10px;">Generated: ${new Date().toLocaleString()} • Total: ${list.length}</div>
                <table style="width:100%; border-collapse:collapse; font-size:12px;">
                    <thead>
                        <tr style="background:#4F46E5; color:#fff;">
                            <th style="padding:6px 8px; text-align:left;">#</th>
                            <th style="padding:6px 8px; text-align:left;">Name</th>
                            <th style="padding:6px 8px; text-align:left;">Class</th>
                            <th style="padding:6px 8px; text-align:left;">Roll</th>
                            <th style="padding:6px 8px; text-align:left;">Father's Name</th>
                            ${currentTab !== "apaar" ? `<th style="padding:6px 8px;">Aadhar</th>` : ""}
                            ${currentTab !== "aadhar" ? `<th style="padding:6px 8px;">APAAR</th>` : ""}
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>`;
        }

        async function renderReportToCanvas() {
            const list = getFiltered();
            const reportRoot = document.getElementById("reportRoot");
            reportRoot.innerHTML = buildReportHTML(list);
            const canvas = await html2canvas(reportRoot, { scale: 2, backgroundColor: "#ffffff" });
            reportRoot.innerHTML = "";
            return canvas;
        }

        document.getElementById("downloadImgBtn").addEventListener("click", async (e) => {
            const btn = e.currentTarget;
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="ri-loader-4-line animate-spin"></i>';
            const canvas = await renderReportToCanvas();
            const link = document.createElement("a");
            link.download = reportTitle().replace(/\s+/g, "_") + ".png";
            link.href = canvas.toDataURL("image/png");
            link.click();
            btn.innerHTML = original;
        });

        document.getElementById("downloadPdfBtn").addEventListener("click", async (e) => {
            const btn = e.currentTarget;
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="ri-loader-4-line animate-spin"></i>';
            const canvas = await renderReportToCanvas();
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF("p", "pt", "a4");
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            const imgWidth = pageWidth;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;

            let heightLeft = imgHeight;
            let position = 0;
            const imgData = canvas.toDataURL("image/png");

            pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
            heightLeft -= pageHeight;
            while (heightLeft > 0) {
                position = heightLeft - imgHeight;
                pdf.addPage();
                pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;
            }
            pdf.save(reportTitle().replace(/\s+/g, "_") + ".pdf");
            btn.innerHTML = original;
        });
    </script>
</body>

</html>
